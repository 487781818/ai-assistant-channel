<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Remote Channel Example</title>
<style>
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #14181f; color: #e6e9ee; }
  #bar { height: 120px; box-sizing: border-box; padding: 12px 16px; border-bottom: 1px solid #2a3038; }
  .row { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .title { font-weight: 600; font-size: 15px; }
  label { font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  input[type=text] { background: #0d1015; color: #9fd3ff; border: 1px solid #2a3038; border-radius: 6px; padding: 5px 8px; width: 340px; font-family: Consolas, monospace; font-size: 12px; }
  button { background: #232a33; color: #e6e9ee; border: 1px solid #39424e; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  button:hover { background: #2c3540; }
  .hint { font-size: 12px; color: #8a93a1; }
  #stage-hint { padding: 24px 16px; color: #5d6673; font-size: 13px; }
  #audit { display: none; padding: 12px 16px; font-size: 12px; font-family: Consolas, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="bar">
  <div class="row">
    <span class="title">远程通道示例</span>
    <label><input type="checkbox" id="enabled"> 启用通道（端口 5175）</label>
    <label><input type="checkbox" id="pcenabled"> 启用电脑管理</label>
    <button id="show-main">显示助手浏览器</button>
    <button id="hide-browsers">隐藏浏览器</button>
    <button id="show-audit">通道流水</button>
  </div>
  <div class="row">
    <span class="hint">令牌</span>
    <input type="text" id="token" readonly>
    <button id="copy">复制令牌</button>
    <button id="regen">换一个令牌</button>
    <span class="hint">把令牌私下发给你的助手；换令牌后旧令牌立即失效。</span>
  </div>
</div>
<div id="stage-hint">助手浏览器会显示在这一区域（通过通道调用时会自动唤醒，平时隐藏）。</div>
<div id="audit"></div>
<script>
  const $ = (id) => document.getElementById(id);
  async function refresh() {
    const s = await window.oc.getSettings();
    $('enabled').checked = s.enabled;
    $('pcenabled').checked = s.pcEnabled;
    $('token').value = s.token;
  }
  $('enabled').addEventListener('change', async (e) => { await window.oc.setEnabled(e.target.checked); refresh(); });
  $('pcenabled').addEventListener('change', async (e) => { await window.oc.setPcEnabled(e.target.checked); refresh(); });
  $('copy').addEventListener('click', () => { $('token').select(); document.execCommand('copy'); });
  $('regen').addEventListener('click', async () => { await window.oc.regenToken(); refresh(); });
  $('show-main').addEventListener('click', () => { $('audit').style.display = 'none'; window.oc.showBrowser('main'); });
  $('hide-browsers').addEventListener('click', () => window.oc.hideBrowsers());
  $('show-audit').addEventListener('click', async () => {
    await window.oc.hideBrowsers();
    const rows = await window.oc.getAudit();
    $('audit').style.display = 'block';
    $('audit').textContent = rows.map(r => r.t + '  ' + r.kind + '  ' + r.detail).join('\n') || '(暂无流水)';
  });
  refresh();
</script>
</body>
</html>
